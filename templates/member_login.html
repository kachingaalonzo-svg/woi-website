<!DOCTYPE html>
<html>
<head>
<title>WOI Member Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:'Outfit';background:#fdf6f0;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:white;padding:32px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.1);width:100%;max-width:380px;text-align:center}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-top:12px;box-sizing:border-box}
button{width:100%;margin-top:16px;background:#2a0a2a;color:white;padding:12px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
.error{background:#ffe0e0;color:#a00;padding:10px;border-radius:8px;margin-top:12px;font-size:13px}
a{color:#c93a8a;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box">
<h2 style="font-family:'Playfair Display';color:#2a0a2a">Member Login</h2>
<p style="font-size:13px;color:#666">4000 Women Strong • Est. 1997</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">
<input name="email" type="email" placeholder="Email address" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login →</button>
</form>
<p style="font-size:13px;margin-top:16px">No account? <a href="/register">Register Now</a></p>
<p style="font-size:12px;margin-top:10px"><a href="/">← Back to Home</a></p>
</div>
</body>
</html>
