<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Member Login</title><style>body{font-family:Inter;background:#fef6f1;display:flex;justify-content:center;align-items:center;min-height:100vh} .box{background:white;padding:26px;border-radius:18px;width:360px;border:1px solid #f0d8d0} .input{width:100%;padding:11px;border-radius:10px;border:1px solid #e8d0c8;margin-top:10px} .btn{background:#3c0f32;color:white;padding:12px;border-radius:100px;border:0;width:100%;margin-top:14px;font-weight:700}</style></head><body><div class="box"><h3 style="color:#3c0f32">Member Login</h3>{% if error %}<p style="color:red;font-size:12px">{{error}}</p>{% endif %}<form method="POST"><input class="input" name="email" type="email" placeholder="Email" required><input class="input" name="password" type="password" placeholder="Password" required><button class="btn">Login</button></form><p style="font-size:11px;text-align:center;margin-top:12px">No account? <a href="/register">Register</a></p></div></body></html>
