<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Member Login - WOI</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#2a0a2a 0%,#5a1a5a 50%,#c9a227 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;width:100%;max-width:420px;border-radius:20px;padding:35px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo{text-align:center;font-size:48px}.card h1{text-align:center;color:#2a0a2a;margin:5px 0}.card p.sub{text-align:center;color:#888;margin-top:0}
label{font-weight:600;font-size:13px;color:#333;display:block;margin-top:15px}
input{width:100%;padding:13px;margin-top:6px;border:2px solid #eee;border-radius:10px;font-size:15px;outline:none} input:focus{border-color:#c9a227}
button{width:100%;padding:14px;margin-top:22px;background:#2a0a2a;color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer} button:hover{background:#4a1a4a}
.msg{padding:12px;border-radius:10px;background:#ffe0e0;border:1px solid #ff9999;color:#900;font-size:14px;margin-top:10px}
.links{text-align:center;margin-top:18px;font-size:14px} a{color:#2a0a2a;font-weight:600}
.badge{text-align:center;background:#fdf6f0;padding:8px;border-radius:20px;font-size:12px;color:#666;margin-top:15px}
</style></head>
<body><div class="card">
<div class="logo">👑</div><h1>Welcome Back</h1><p class="sub">Login to your WOI Member Account</p>
{% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="msg">{{m}}</div>{% endfor %}{% endif %}{% endwith %}
<form method="POST">
<label>Email Address</label><input name="email" type="email" placeholder="you@gmail.com" required>
<label>Password</label><input name="password" type="password" placeholder="••••••••" required>
<button>Login →</button>
</form>
<div class="links">New here? <a href="/register">Join WOI Free</a><br><br><a href="/">← Back to Home</a></div>
<div class="badge">Women of Influence • Empowering Women</div>
</div></body></html>
