<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Member Login - WOI</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"></head>
<body><header><div class="logo"><div class="logo-icon">W</div><div class="logo-text">WOI<br><span>MEMBER</span></div></div><div class="nav-pills"><a class="pill pill-light" href="/">Home</a><a class="pill pill-dark" href="/register">Register</a></div></header>
<section style="max-width:500px;margin:0 auto"><h2 style="font-family:'Playfair Display';font-size:38px;color:#3c0f32;text-align:center">Member Login</h2><div style="background:white;border-radius:20px;padding:28px;margin-top:20px"><input id="l_phone" class="input" placeholder="Phone"><input id="l_pass" type="password" class="input" placeholder="Password"><button class="btn-primary" style="width:100%;margin-top:16px" onclick="login()">Login →</button><p id="l_msg" style="text-align:center;margin-top:12px"></p></div></section>
<script>async function login(){const phone=document.getElementById('l_phone').value,password=document.getElementById('l_pass').value;const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})});const d=await res.json();document.getElementById('l_msg').textContent=d.msg;if(res.ok)window.location.href='/member/dashboard'}</script>
{% include 'partials/footer.html' %}
</body>
</html>
