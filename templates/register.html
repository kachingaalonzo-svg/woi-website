<!DOCTYPE html>
<html>
<head><title>WOI Register</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit';background:#fdf6f0;margin:0;padding:20px} .box{background:white;max-width:600px;margin:0 auto;padding:24px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,0.08)} input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #ddd;margin-top:8px;box-sizing:border-box} button{width:100%;margin-top:16px;background:#2a0a2a;color:white;padding:14px;border-radius:12px;border:0;font-weight:800;cursor:pointer} label{font-size:12px;font-weight:700;color:#444;margin-top:12px;display:block}</style>
</head>
<body>
<div class="box">
<h2 style="font-family:'Playfair Display';text-align:center;color:#2a0a2a">Join WOI - 4000 Women Strong</h2>
<p style="text-align:center;font-size:13px;color:#666">Est. 1997 • First Saturday 13:00-18:00 • Founder Elfridah Mhusambazi</p>
<form method="POST" enctype="multipart/form-data">
<label>Full Name</label><input name="full_name" required>
<label>Email</label><input name="email" type="email" required>
<label>Password</label><input name="password" type="password" required>
<label>Phone</label><input name="phone" required>
<label>Province</label><select name="province"><option>Lusaka</option><option>Copperbelt</option><option>Central</option><option>Western</option><option>Eastern</option><option>Northern</option><option>Southern</option><option>Muchinga</option><option>North-Western</option><option>Luapula</option></select>
<label>District</label><input name="district" value="Lusaka">
<label>Church</label><input name="church" placeholder="Your church">
<label>Profile Photo (optional)</label><input type="file" name="profile_pic" accept="image/*">
<button type="submit">Register → Join 4000 Women</button>
</form>
<p style="text-align:center;font-size:13px;margin-top:16px"><a href="/member/login" style="color:#c93a8a;font-weight:700;text-decoration:none">Already have account? Login</a></p>
</div>
</body>
</html>
