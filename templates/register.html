<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WOI Member Registration</title>
<style>:root{--wine:#3c0f32;--rose:#c93a8a;--beige:#fef6f1}body{font-family:Inter,sans-serif;background:var(--beige);padding:20px} .box{max-width:700px;margin:auto;background:white;border-radius:18px;padding:26px;border:1px solid #f0d8d0} h2{font-family:Cormorant Garamond;color:var(--wine);font-size:28px} label{font-size:11px;font-weight:700;color:var(--wine);margin-top:12px;display:block} .input{width:100%;padding:11px;border-radius:10px;border:1px solid #e8d0c8;margin-top:4px;font-size:13px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .btn{background:var(--wine);color:white;padding:14px;border-radius:100px;border:0;width:100%;font-weight:700;margin-top:18px;cursor:pointer} @media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body>
<div class="box"><h2>WOI Membership Registration</h2><p style="font-size:11px;color:#8a7a7a">Lusaka — First Saturday 13:00-18:00 • Free • Est. 1997 • 4000 Women</p>
<form method="POST" enctype="multipart/form-data" action="/register">
<label>Profile Picture *</label><input class="input" type="file" name="profile_pic" accept="image/*" required>
<label>Full Name (as on NRC) *</label><input class="input" name="full_name" required>
<div class="grid"><div><label>NRC Number *</label><input class="input" name="nrc" placeholder="123456/10/1" required></div><div><label>Date of Birth *</label><input class="input" type="date" name="dob" required></div></div>
<div class="grid"><div><label>Gender *</label><select class="input" name="gender" required><option>Female</option><option>Male</option></select></div><div><label>Marital Status</label><select class="input" name="marital_status"><option>Single</option><option>Married</option><option>Widowed</option><option>Divorced</option></select></div></div>
<label>Email (for account) *</label><input class="input" type="email" name="email" required>
<div class="grid"><div><label>Password *</label><input class="input" type="password" name="password" required minlength="6"></div><div><label>Confirm Password *</label><input class="input" type="password" name="confirm" required></div></div>
<div class="grid"><div><label>Phone (MTN/Airtel) *</label><input class="input" name="phone" placeholder="0977xxxxxx" required></div><div><label>WhatsApp</label><input class="input" name="whatsapp"></div></div>
<label>Residential Address *</label><input class="input" name="residential_address" placeholder="House No, Street" required>
<div class="grid"><div><label>Compound / Area *</label><input class="input" name="compound" placeholder="Matero, Kalingalinga, Kabwata..." required></div><div><label>District</label><input class="input" name="district" value="Lusaka"></div></div>
<div class="grid"><div><label>Province *</label><select class="input" name="province"><option>Lusaka</option><option>Copperbelt</option><option>Central</option><option>Southern</option><option>Eastern</option><option>Western</option><option>Northern</option><option>Muchinga</option><option>Luapula</option><option>North-Western</option></select></div><div><label>Occupation</label><input class="input" name="occupation" placeholder="Teacher, Business..."></div></div>
<label>Church / Organization</label><input class="input" name="church">
<label>Foundation Interest</label><select class="input" name="foundation_interest"><option>Barak Foundation - School</option><option>University Dreams</option><option>Rural Clinic</option><option>Business Empowerment</option><option>Pastors Wives Network</option></select>
<div class="grid"><div><label>Next of Kin Name *</label><input class="input" name="next_of_kin_name" required></div><div><label>Next of Kin Phone *</label><input class="input" name="next_of_kin_phone" required></div></div>
<button class="btn">Create Account & Join WOI →</button><p style="font-size:10px;text-align:center;margin-top:10px">Already have account? <a href="/member/login">Login</a></p>
</form></div></body></html>
