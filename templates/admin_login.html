<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login - WOI</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#111 0%,#2a0a2a 60%,#c9a227 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:white;width:100%;max-width:420px;border-radius:20px;padding:35px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.logo{text-align:center;font-size:48px}.card h1{text-align:center;color:#111;margin:5px 0}.card p.sub{text-align:center;color:#888;margin-top:0}
label{font-weight:600;font-size:13px;display:block;margin-top:15px} input{width:100%;padding:13px;margin-top:6px;border:2px solid #eee;border-radius:10px;font-size:15px;outline:none} input:focus{border-color:#c9a227}
button{width:100%;padding:14px;margin-top:22px;background:#111;color:white;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer} button:hover{background:#2a0a2a}
.msg{padding:12px;border-radius:10px;background:#ffe0e0;border:1px solid #ff9999;color:#900;font-size:14px;margin-top:10px}
.links{text-align:center;margin-top:18px;font-size:14px} a{color:#2a0a2a;font-weight:600}
.hint{text-align:center;background:#fff8e1;padding:10px;border-radius:10px;font-size:13px;color:#666;margin-top:15px}
</style></head>
<body><div class="card">
<div class="logo">🔐</div><h1>Admin Portal</h1><p class="sub">WOI Management Only</p>
{% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="msg">{{m}}</div>{% endfor %}{% endif %}{% endwith %}
<form method="POST">
<label>Username</label><input name="username" placeholder="admin" required>
<label>Password</label><input name="password" type="password" placeholder="••••••••" required>
<button>Login as Admin →</button>
</form>
<div class="hint">Demo: admin / woi2026<br>Change this after you go live!</div>
<div class="links"><a href="/">← Back to Home</a></div>
</div></body></html>
