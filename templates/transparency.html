<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Transparency - WOI</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"></head>
<body><header><div class="logo"><div class="logo-icon">W</div><div class="logo-text">WOI<br><span>TRANSPARENCY</span></div></div><div class="nav-pills"><a class="pill pill-light" href="/">Home</a><a class="pill pill-dark" href="/register">Donate</a></div></header>
<section><h2 style="font-family:'Playfair Display';font-size:42px;color:#3c0f32;text-align:center">Donation Transparency</h2><p style="text-align:center;color:#6a5a6a">All donations saved to database. Payment only at confirmation: Airtel 0975826286 / ABSA 0000001011355</p><div id="donationsList" style="margin-top:24px;background:white;border-radius:20px;padding:20px"></div></section>
<script>async function load(){const res=await fetch('/api/donations');const data=await res.json();document.getElementById('donationsList').innerHTML=data.map(d=>`<div style="padding:12px;border-bottom:1px solid #f0d8d0;display:flex;justify-content:space-between"><b>${d.name}</b><span>${d.project} - K${d.amount}</span><span style="color:#00a859">${d.method}</span></div>`).join('')||'No donations yet'}load()</script>
