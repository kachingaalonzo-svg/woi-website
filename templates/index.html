<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Women of Influence International | Prophetess Elfridah Mhusambazi | 4000 Women Strong</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800;900&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<style>
:root{--wine:#2a0a2a;--pink:#c93a8a;--cream:#fdf6f0;--gold:#d4af37;--dark:#150415;--text:#1a1a1a;--muted:#333333}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden;font-size:16px;line-height:1.6}
h1,h2,h3{font-family:'Playfair Display',serif;color:#2a0a2a;line-height:1.25}
p,li{font-size:15px;line-height:1.65;color:#222}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.6}50%{transform:scale(1.03);opacity:1}}
@keyframes professionalGlow{0%,100%{box-shadow:0 18px 45px rgba(0,0,0,0.45),0 0 0 2px #d4af37,0 0 22px rgba(212,175,55,0.25)}50%{box-shadow:0 18px 45px rgba(0,0,0,0.45),0 0 0 2px #d4af37,0 0 34px rgba(212,175,55,0.45)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp 0.9s ease both}
nav{background:#2a0a2a;color:white;padding:14px 18px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
nav a{color:white;text-decoration:none;margin-left:6px;font-size:12px;font-weight:800;background:rgba(255,255,255,0.18);padding:8px 13px;border-radius:100px}
nav a:hover{background:rgba(255,255,255,0.32)}
.awesome-header{font-family:'Cinzel Decorative',cursive;font-weight:900;font-size:46px;line-height:0.95;letter-spacing:1px;color:#ffffff;text-shadow:0 2px 12px rgba(0,0,0,0.4)}
.awesome-sub{font-family:'Playfair Display',serif;font-weight:900;font-size:20px;letter-spacing:6px;color:#ffdf6b;margin-top:10px}
.section{padding:48px 20px;max-width:1150px;margin:0 auto}
.section-dark{background:var(--wine);color:white;border-radius:28px;margin:20px;padding:40px 20px}
.section-dark h2,.section-dark h3{color:white}
.section-dark p,.section-dark li{color:#f5f5f5}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(42,10,42,0.08);margin-top:16px;transition:0.3s}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 35px rgba(42,10,42,0.12)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}}
.testimony{border-left:5px solid var(--pink);padding:14px 16px;margin-top:16px;background:#fff8fb;border-radius:0 12px 12px 0}
.testimony p{font-size:15px;color:#222}
.tag{display:inline-block;background:#fce4f0;color:#8a104f;font-size:11px;font-weight:900;padding:6px 11px;border-radius:100px}
.official{background:white;border:1px solid #ead9e0;border-radius:16px;padding:20px;font-size:15px;line-height:1.7;color:#222}
.video-box{background:#000;border-radius:16px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;cursor:pointer}
.play{width:58px;height:58px;background:var(--pink);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:22px}
.book{border:1px solid #f3d1e3;border-radius:16px;padding:18px;text-align:center;background:white}
.btn{display:inline-block;padding:14px 26px;border-radius:100px;text-decoration:none;font-weight:900;font-size:14px;margin:6px}
.btn-pink{background:var(--pink);color:white}.btn-white{background:white;color:var(--wine)}.btn-gold{background:var(--gold);color:#1a1a1a}.btn-dark{background:var(--wine);color:white}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;justify-content:center;align-items:center;padding:20px}.modal.active{display:flex}.modal-box{background:white;border-radius:18px;padding:24px;max-width:400px;width:100%}
.footer{background:#150415;color:white;padding:30px 20px;text-align:center;font-size:13px;margin-top:20px;line-height:1.7}
.footer p{color:#eee}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #bbb;margin-top:8px;box-sizing:border-box;font-size:15px}
.gallery-img{width:100%;height:190px;object-fit:cover;border-radius:14px}
.caption{font-size:13px;text-align:center;margin-top:8px;color:#333;line-height:1.5}
.caption b{font-size:14px;color:#2a0a2a}
@media(max-width:480px){.awesome-header{font-size:34px}.awesome-sub{font-size:18px}}
</style>
</head>
